name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: mv target/PeerAssist3-1.0-SNAPSHOT.jar target/PeerAssist.jar

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/PeerAssist.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
